name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]" -e ".[report-claude]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: python -m pytest

      # Coverage gate runs only on Python 3.12/3.13, where sys.monitoring
      # (COVERAGE_CORE=sysmon) provides a reliable tracer. This avoids the
      # C-tracer issues seen with some numpy builds and keeps older matrix
      # rows fast while still enforcing the 80% floor on recent interpreters.
      - name: Coverage
        if: matrix.python-version == '3.12' || matrix.python-version == '3.13'
        env:
          COVERAGE_CORE: sysmon
        run: python -m pytest --cov=vllm_benchmark --cov-report=term-missing --cov-fail-under=70
